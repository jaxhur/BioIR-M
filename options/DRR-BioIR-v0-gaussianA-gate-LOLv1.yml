# DRR-BioIR v0 LOL-v1 gate A_D supervision configuration.
name: DRR-BioIR-v0-gaussianA-gate-LOLv1
model_type: DRRImageRestorationModel
scale: 1
num_gpu: 1
manual_seed: 42

datasets:
  train:
    name: LOLv1-train
    type: PairedImageDataset
    dataroot_gt: ./datasets/LOL-v1/our485/high
    dataroot_lq: ./datasets/LOL-v1/our485/low
    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size: 256
    use_flip: true
    use_rot: true
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: LOLv1-test
    type: PairedImageDataset
    dataroot_gt: ./datasets/LOL-v1/eval15/high
    dataroot_lq: ./datasets/LOL-v1/eval15/low
    filename_tmpl: '{}'
    io_backend:
      type: disk

network_g:
  type: DRRBioIR
  inp_channels: 3
  out_channels: 3
  dim: 32
  num_blocks: [1, 1, 2]
  num_refinement_blocks: 4
  ffn_expansion_factor: 3
  bias: false
  prior_hidden_channels: 16
  # The padding factor keeps all three detail-token grids aligned with A/R.
  input_pad_factor: 32
  adri_context_patch_sizes: [64, 32, 16]
  adri_detail_patch_sizes: [16, 8, 4]
  adri_num_heads: 1
  # P3 enables all scales; use [2, 3] or [3] for P2 or P1 ablations.
  adri_scales: [1, 2, 3]
  # v0 verifies DCBC plus ADRI first; enable this for a matched RA-GDFN ablation.
  use_ra_gdfn: false
  structure_tau: 0.10
  log_epsilon: 0.02
  gate_topk: 16

path:
  pretrain_network_g:
  strict_load_g:
  resume_state:

train:
  optim_g:
    type: AdamW
    lr: !!float 1e-3
    weight_decay: !!float 1e-3
    betas: [0.9, 0.9]
  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 150000
    eta_min: !!float 1e-7
  total_iter: 150000
  warmup_iter: -1
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  fft_loss_opt:
    type: FFTLoss
    loss_weight: 0.1
    reduction: mean
  # A/R targets use paired GT only during training; inference reads only LQ input.
  drr_loss_opt:
    demand_loss_weight: 0.05
    reliability_loss_weight: 0.05
    smooth_l1_beta: 0.10
    # gate 直接监督补边后实际送入 ADRI 的 A_D；R 仍采用带 edge_weight 的像素级监督。
    demand_supervision_type: gate
    demand_target_type: gaussian_smoothed_absolute_gap
    demand_epsilon: 0.05
    demand_gaussian_kernel_size: 15
    demand_gaussian_sigma: 3.0
    demand_tau: 0.6374053955078125
    structure_tau: 0.10
    magnitude_tau: 0.05
    log_epsilon: 0.02
    reliability_epsilon: !!float 1e-6
    edge_weight: 4.0
    prior_visualization_freq: 1000

val:
  val_freq: !!float 1e3
  save_img: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
      ssim3d: false

logger:
  print_freq: 20
  save_checkpoint_freq: !!float 1e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
