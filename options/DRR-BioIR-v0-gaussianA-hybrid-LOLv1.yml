# DRR-BioIR v0 LOL-v1 的 A 像素级与 gate 级混合监督配置。
name: DRR-BioIR-v0-gaussianA-hybrid-LOLv1
model_type: DRRImageRestorationModel
scale: 1
num_gpu: 1
manual_seed: 42

datasets:
  train:
    name: LOLv1-train
    type: PairedImageDataset
    dataroot_gt: ./datasets/LOL-v1/our485/high
    dataroot_lq: ./datasets/LOL-v1/our485/low
    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size: 256
    use_flip: true
    use_rot: true
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: LOLv1-test
    type: PairedImageDataset
    dataroot_gt: ./datasets/LOL-v1/eval15/high
    dataroot_lq: ./datasets/LOL-v1/eval15/low
    filename_tmpl: '{}'
    io_backend:
      type: disk

network_g:
  type: DRRBioIR
  inp_channels: 3
  out_channels: 3
  dim: 32
  num_blocks: [1, 1, 2]
  num_refinement_blocks: 4
  ffn_expansion_factor: 3
  bias: false
  prior_hidden_channels: 16
  # 补边倍数保证三尺度细节 token 网格与 A/R 对齐。
  input_pad_factor: 32
  adri_context_patch_sizes: [64, 32, 16]
  adri_detail_patch_sizes: [16, 8, 4]
  adri_num_heads: 1
  # P3 启用全部尺度；P2、P1 消融分别使用 [2, 3]、[3]。
  adri_scales: [1, 2, 3]
  # v0 先验证 DCBC 与 ADRI；匹配的 RA-GDFN 消融再开启该选项。
  use_ra_gdfn: false
  structure_tau: 0.10
  log_epsilon: 0.02
  gate_topk: 16

path:
  pretrain_network_g:
  strict_load_g:
  resume_state:

train:
  optim_g:
    type: AdamW
    lr: !!float 1e-3
    weight_decay: !!float 1e-3
    betas: [0.9, 0.9]
  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 150000
    eta_min: !!float 1e-7
  total_iter: 150000
  warmup_iter: -1
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  fft_loss_opt:
    type: FFTLoss
    loss_weight: 0.1
    reduction: mean
  # A/R 目标仅在训练时使用配对 GT；推理仍只读取 LQ。
  drr_loss_opt:
    # A 保留像素级约束，并以较小权重对 ADRI 实际使用的 A_D 追加 gate 约束。
    demand_supervision_type: hybrid
    demand_pixel_loss_weight: 0.05
    demand_gate_loss_weight: 0.01
    # R 保持带 edge_weight 的像素级监督，不改为 gate 级监督。
    reliability_loss_weight: 0.05
    smooth_l1_beta: 0.10
    demand_target_type: gaussian_smoothed_absolute_gap
    demand_epsilon: 0.05
    demand_gaussian_kernel_size: 15
    demand_gaussian_sigma: 3.0
    demand_tau: 0.6374053955078125
    structure_tau: 0.10
    magnitude_tau: 0.05
    log_epsilon: 0.02
    reliability_epsilon: !!float 1e-6
    edge_weight: 4.0
    prior_visualization_freq: 1000

val:
  val_freq: !!float 1e3
  save_img: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
      ssim3d: false

logger:
  print_freq: 20
  save_checkpoint_freq: !!float 1e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
